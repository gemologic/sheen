name: Compare AdminApp performance
on:
  workflow_dispatch:
    inputs:
      base:
        description: Before full 40-character commit SHA, branch, or tag
        required: true
        default: d86a879170afa2a24bf11552b4a0ef50577532f3
        type: string
      candidate:
        description: After full 40-character commit SHA, branch, or tag
        required: true
        default: 529f3de12acaeafbf65f9eebe5a1fc08d1ce04b4
        type: string
permissions:
  contents: read
jobs:
  compare:
    name: Pair ${{ matrix.pair }} (${{ matrix.first }} first)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pair: 1, first: base }
          - { pair: 2, first: candidate }
          - { pair: 3, first: base }
          - { pair: 4, first: candidate }
          - { pair: 5, first: base }
    env:
      SHEEN_BENCHMARK_RUNNER_CLASS: ubuntu-24.04
      SHEEN_ADMIN_BENCHMARK: 'true'
      SHEEN_BENCHMARK_PORT: '4187'
      SHEEN_CAPTURE_CPU_BASELINE: 'false'
      FIRST: ${{ matrix.first }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate }}
          path: candidate
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: harness/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: pnpm
          cache-dependency-path: |
            base/pnpm-lock.yaml
            candidate/pnpm-lock.yaml
      - name: Prepare shared measurement harness
        run: node harness/tools/compare-admin-benchmarks.ts prepare
      - name: Build both applications before measuring
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for target in base candidate; do
            (
              cd "$target" || exit 1
              timeout 300 pnpm install --frozen-lockfile || exit "$?"
              timeout 300 pnpm build
            ) > "comparison/$target-build.log" 2>&1 && touch "comparison/$target-ready" || failed=1
          done
          exit "$failed"
      - name: Install the shared Chromium version
        working-directory: candidate
        run: timeout 300 pnpm exec playwright install --with-deps chromium
      - name: Measure both commits sequentially
        shell: bash
        run: |
          set -euo pipefail
          order=(base candidate)
          if [[ "$FIRST" == candidate ]]; then order=(candidate base); fi
          for target in "${order[@]}"; do
            status=0
            (
              cd "$target" || exit 1
              export GITHUB_SHA
              GITHUB_SHA=$(git rev-parse HEAD) || exit "$?"
              timeout 300 pnpm exec playwright test --config bench/playwright.config.ts
            ) > "comparison/$target-benchmark.log" 2>&1 || status=$?
            printf '%s\n' "$status" > "comparison/$target-exit-code.txt"
          done
      - name: Report paired measurements
        if: always()
        run: node harness/tools/compare-admin-benchmarks.ts report
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: admin-comparison-${{ matrix.pair }}-${{ matrix.first }}-first
          path: |
            comparison
            base/test-results
            candidate/test-results
          retention-days: 30
